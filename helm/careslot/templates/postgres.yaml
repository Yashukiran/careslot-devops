{{- $ctx := dict "root" . "component" "postgres" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "careslot.fullname" $ctx }}
  labels:
    {{- include "careslot.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "careslot.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "careslot.fullname" $ctx }}
  labels:
    {{- include "careslot.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "careslot.fullname" $ctx }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "careslot.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "careslot.selectorLabels" $ctx | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-db
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
