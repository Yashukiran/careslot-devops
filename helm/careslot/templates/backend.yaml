{{- $ctx := dict "root" . "component" "backend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "careslot.fullname" $ctx }}
  labels:
    {{- include "careslot.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "careslot.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "careslot.selectorLabels" $ctx | nindent 8 }}
      annotations:
        # restart pods when the db secret changes
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      initContainers:
        - name: wait-for-db
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h {{ include "careslot.dbHost" . }} -p 5432; do echo waiting for postgres; sleep 2; done"]
          securityContext:
            runAsUser: 70
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db
                  key: DATABASE_URL
            - name: SEED_DATA
              value: {{ .Values.backend.seedData | quote }}
            - name: WORKERS
              value: {{ .Values.backend.workers | quote }}
            - name: CLINIC_TZ
              value: {{ .Values.backend.timezone | quote }}
            - name: APP_VERSION
              value: {{ .Values.backend.image.tag | quote }}
            - name: APP_ENV
              value: {{ .Values.environment | quote }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "careslot.fullname" $ctx }}
  labels:
    {{- include "careslot.labels" . | nindent 4 }}
    {{- include "careslot.selectorLabels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "careslot.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
{{- if .Values.backend.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "careslot.fullname" $ctx }}
  labels:
    {{- include "careslot.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "careslot.fullname" $ctx }}
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
{{- end }}
