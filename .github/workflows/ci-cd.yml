name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # for AWS OIDC login in the deploy job

env:
  REGISTRY: ghcr.io
  TRIVY_VERSION: "0.69.3"
  AWS_REGION: ap-south-1
  CLUSTER_NAME: careslot-eks
  NAMESPACE: careslot

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        run: pytest -v --cov=app --cov-report=term-missing

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  build:
    name: Build, scan & push (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=${REGISTRY}/${owner}/careslot-${{ matrix.service }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # fail the pipeline if the image has HIGH/CRITICAL CVEs that already have a fix
      - name: Trivy scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:${TRIVY_VERSION} image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --scanners vuln \
            --exit-code 1 \
            --no-progress \
            "$IMAGE"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push "$IMAGE"

  deploy:
    name: Deploy to EKS
    needs: build
    # only runs on main, and only once the AWS role from terraform has been added as a repo variable
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Helm upgrade
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm upgrade --install careslot ./helm/careslot \
            --namespace "$NAMESPACE" --create-namespace \
            -f helm/careslot/values-dev.yaml \
            --set backend.image.repository=${REGISTRY}/${owner}/careslot-backend \
            --set frontend.image.repository=${REGISTRY}/${owner}/careslot-frontend \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }} \
            --wait --timeout 10m

      - name: Show rollout
        run: |
          kubectl get pods,svc,ingress,hpa -n "$NAMESPACE"
          kubectl rollout status deployment/careslot-backend -n "$NAMESPACE"
          kubectl rollout status deployment/careslot-frontend -n "$NAMESPACE"
