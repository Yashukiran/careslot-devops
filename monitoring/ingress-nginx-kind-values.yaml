# ingress-nginx for kind: binds to the node's port 80, which kind maps to localhost:80
controller:
  hostPort:
    enabled: true
  service:
    type: ClusterIP
  nodeSelector:
    ingress-ready: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  admissionWebhooks:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 90Mi
