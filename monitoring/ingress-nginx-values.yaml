# helm install ingress-nginx ingress-nginx/ingress-nginx \
#   -n ingress-nginx --create-namespace -f monitoring/ingress-nginx-values.yaml
controller:
  replicaCount: 1
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 90Mi
