services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careslot
      POSTGRES_USER: careslot
      POSTGRES_PASSWORD: careslot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careslot -d careslot"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://careslot:careslot@postgres:5432/careslot
      SEED_DATA: "true"
      CLINIC_TZ: Asia/Kolkata
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      - backend

volumes:
  pgdata:
